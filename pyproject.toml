[project]
name = "fono-system"
version = "0.1.0"
description = "Sistema de gestao de pacientes e evolucoes para clinica de fonoaudiologia"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "python-dotenv==1.0.1",
    "slowapi==0.1.9",
    "redis==5.0.8",
    "minio==7.2.9",
    "python-multipart==0.0.12",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "openai>=2.46.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
